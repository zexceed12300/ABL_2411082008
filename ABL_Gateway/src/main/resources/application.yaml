server:
  port: 9001

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUCT
              uri: lb://product
              predicates: 
                - Path=api/product/**
            # CQRS: operasi tulis diarahkan ke Command Service
            - id: ORDER-COMMAND
              uri: lb://order-command
              predicates:
                - Path=api/order/**
                - Method=POST,PUT,DELETE
            # CQRS: operasi baca diarahkan ke Query Service
            - id: ORDER-QUERY
              uri: lb://order-query
              predicates:
                - Path=api/order/**
                - Method=GET
            - id: CUSTOMER
              uri: lb://pelanggan
              predicates:
                - Path=api/customer/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost
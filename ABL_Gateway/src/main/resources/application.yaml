server:
  port: 9001

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUCT
              uri: lb://product
              predicates: 
                - Path=api/product/**
            - id: PRODUCT-CATEGORY
              uri: lb://product
              predicates:
                - Path=api/product-category/**
            - id: ORDER-WRITE
              uri: lb://order
              predicates:
                - Path=api/order/**
                - Method=POST,PUT,DELETE
            - id: ORDER-READ
              uri: lb://order-query
              predicates:
                - Path=api/order/**
                - Method=GET
            - id: ORDER-QUERY-DIRECT
              uri: lb://order-query
              predicates:
                - Path=api/order-query/**
            - id: CUSTOMER
              uri: lb://pelanggan
              predicates:
                - Path=api/customer/**
            - id: AUTH
              uri: lb://auth
              predicates:
                - Path=api/auth/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost
server:
  port: 9001

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: PRODUCT
              uri: lb://product
              predicates: 
                - Path=api/product/**
            - id: ORDER
              uri: lb://order
              predicates:
                - Path=api/order/**
            - id: CUSTOMER
              uri: lb://pelanggan
              predicates:
                - Path=api/customer/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      hostname: localhost